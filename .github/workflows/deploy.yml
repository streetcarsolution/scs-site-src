name: Deploy to OVH (FTP)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          # ftps : meme serveur, meme port, mais le mot de passe et les fichiers
          # voyagent chiffres. (Avec « ftp », ils passaient en clair.)
          protocol: ftps
          port: 21
          server-dir: /www/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.DS_Store
            **/README.md
            **/prompts.txt
          # PAS DE « dangerous-clean-slate » : il effaçait tout le site sur le
          # serveur avant de le renvoyer, à chaque envoi. Pendant ce temps les
          # pages répondaient 404, et un envoi coupé en route laissait le site
          # à moitié vide. Sans lui, l'action compare avec son fichier d'état
          # (.ftp-deploy-sync-state.json, sur le serveur) : elle n'envoie que
          # ce qui a changé et retire ce qui a été supprimé du dépôt.
          # Pour forcer un envoi complet : supprimer ce fichier d'état en FTP.
          log-level: standard
